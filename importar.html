<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importar Dados — UnitV</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{background:#0F0F0F;color:#fff;padding:20px;min-height:100vh}
    .container{max-width:600px;margin:0 auto}
    h1{color:#E50914;margin-bottom:10px}
    .card{background:#1C1C1C;padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid #333}
    button{background:#E50914;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin:5px}
    button:hover{background:#F40612}
    button.secundario{background:#333}
    button.secundario:hover{background:#444}
    pre{background:#000;padding:15px;border-radius:8px;overflow-x:auto;font-size:12px;color:#10B981;max-height:200px;overflow-y:auto}
    .status{margin-top:15px;padding:10px;border-radius:6px}
    .sucesso{background:rgba(16,185,129,0.2);border:1px solid #10B981;color:#10B981}
    .erro{background:rgba(239,68,68,0.2);border:1px solid #EF4444;color:#EF4444}
    .info{background:rgba(59,130,246,0.2);border:1px solid #3B82F6;color:#3B82F6}
    textarea{width:100%;height:150px;background:#000;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;font-size:13px;margin-bottom:10px}
    label{display:block;margin-bottom:5px;font-weight:bold;color:#ccc}
  </style>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBQiyddSH2U_XivgbJxTcYRxKw4wEl242E",
      authDomain: "tv-pequena-africa.firebaseapp.com",
      projectId: "tv-pequena-africa",
      storageBucket: "tv-pequena-africa.firebasestorage.app",
      messagingSenderId: "720185325269",
      appId: "1:720185325269:web:58f4d74e1dfc85a3bf545c"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.FirebaseModules = { addDoc, collection };
  </script>
</head>
<body>
  <div class="container">
    <h1>📥 Importar Dados em Massa</h1>
    <p style="color:#888;margin-bottom:25px;">Cadastre vários filmes e séries de uma vez só no Firebase</p>

    <!-- 🎬 FILMES -->
    <div class="card">
      <h2>🎬 Importar Filmes</h2>
      <p style="color:#888;font-size:14px;margin-bottom:10px;">Cole os dados em formato JSON abaixo:</p>
      <textarea id="dadosFilmes" placeholder='[{"titulo":"Nome do Filme","ano":2025,"genero":"acao","duracao":"2h 15m","novo":true,"desc":"Descrição"}]'>
[
  {"titulo":"O Último Horizonte","ano":2025,"genero":"acao","duracao":"2h 15m","novo":true,"desc":"Uma jornada épica por mundos desconhecidos"},
  {"titulo":"Coração de Areia","ano":2025,"genero":"drama","duracao":"1h 52m","novo":true,"desc":"Uma história emocionante de superação"},
  {"titulo":"Operação Aurora","ano":2024,"genero":"acao","duracao":"2h 08m","novo":false,"desc":"Missão de resgate internacional"},
  {"titulo":"Risos no Escuro","ano":2024,"genero":"comedia","duracao":"1h 45m","novo":false,"desc":"Comédia para toda a família"},
  {"titulo":"A Noite Sem Fim","ano":2025,"genero":"terror","duracao":"1h 58m","novo":true,"desc":"O terror está apenas começando"},
  {"titulo":"Caminhos Cruzados","ano":2024,"genero":"drama","duracao":"2h 02m","novo":false,"desc":"Vidas que se encontram e se separam"}
]
      </textarea>
      <button onclick="importarFilmes()">🚀 Importar Filmes</button>
      <div id="statusFilmes"></div>
    </div>

    <!-- 📼 SÉRIES -->
    <div class="card">
      <h2>📼 Importar Séries</h2>
      <p style="color:#888;font-size:14px;margin-bottom:10px;">Cole os dados em formato JSON abaixo:</p>
      <textarea id="dadosSeries" placeholder='[{"titulo":"Nome da Série","temporadas":3,"genero":"drama","episodios":30,"novo":true,"desc":"Descrição"}]'>
[
  {"titulo":"Cidade Oculta","temporadas":3,"genero":"suspense","episodios":30,"novo":true,"desc":"Segredos escondidos em uma pequena cidade"},
  {"titulo":"Sala de Espera","temporadas":4,"genero":"comedia","episodios":48,"novo":false,"desc":"Vida caótica de um hospital"},
  {"titulo":"Mentes Brilhantes","temporadas":5,"genero":"drama","episodios":55,"novo":true,"desc":"Inteligência, paixão e conflitos"},
  {"titulo":"Vizinhos","temporadas":2,"genero":"comedia","episodios":20,"novo":false,"desc":"Risadas garantidas na rua de baixo"}
]
      </textarea>
      <button onclick="importarSeries()">🚀 Importar Séries</button>
      <div id="statusSeries"></div>
    </div>

    <!-- 🔗 Links -->
    <div class="card" style="text-align:center">
      <a href="index.html" style="color:#E50914;text-decoration:none">← Voltar para o UnitV</a>
    </div>
  </div>

  <script>
    function mostrarStatus(id, mensagem, tipo){
      const el = document.getElementById(id);
      el.innerHTML = `<div class="status ${tipo}">${mensagem}</div>`;
    }

    async function importarFilmes(){
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = "⏳ Importando...";
      mostrarStatus('statusFilmes', '📡 Conectando ao Firebase...', 'info');
      
      try{
        const dados = JSON.parse(document.getElementById('dadosFilmes').value);
        const { collection, addDoc } = window.FirebaseModules;
        let contador = 0;
        
        for(const filme of dados){
          await addDoc(collection(window.db, 'filmes'), filme);
          contador++;
          console.log(`✅ ${filme.titulo}`);
        }
        
        mostrarStatus('statusFilmes', `✅ SUCESSO! ${contador} filmes importados! Atualize seu site para ver.`, 'sucesso');
      }catch(erro){
        mostrarStatus('statusFilmes', `❌ Erro: ${erro.message}`, 'erro');
      }
      
      btn.disabled = false;
      btn.textContent = "🚀 Importar Filmes";
    }

    async function importarSeries(){
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = "⏳ Importando...";
      mostrarStatus('statusSeries', '📡 Conectando ao Firebase...', 'info');
      
      try{
        const dados = JSON.parse(document.getElementById('dadosSeries').value);
        const { collection, addDoc } = window.FirebaseModules;
        let contador = 0;
        
        for(const serie of dados){
          await addDoc(collection(window.db, 'series'), serie);
          contador++;
          console.log(`✅ ${serie.titulo}`);
        }
        
        mostrarStatus('statusSeries', `✅ SUCESSO! ${contador} séries importadas! Atualize seu site para ver.`, 'sucesso');
      }catch(erro){
        mostrarStatus('statusSeries', `❌ Erro: ${erro.message}`, 'erro');
      }
      
      btn.disabled = false;
      btn.textContent = "🚀 Importar Séries";
    }
  </script>
</body>
</html>
